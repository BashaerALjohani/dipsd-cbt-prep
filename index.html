<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#D3367A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CBT Prep">
<meta name="description" content="Bilingual (English/Arabic) study site for the DIPSD mock CBT.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23D3367A'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white'%3E%E2%9C%BF%3C/text%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[data-ask],[data-ask-ga]{display:none!important}</style>
</head>
<body>
<title>DIPSD CBT Prep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Baloo+Bhaijaan+2:wght@500;600;700&family=Cinzel:wght@600;700&family=Fredoka:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Two deliberate looks, switched from the header.
   ROSE  = a soft pink study room (light).
   MAGIC = a night library: midnight sky, gold and parchment (dark).
   Layout: sticky header + tab strip, one centred column (max 1080px). */
:root{
  color-scheme:light;
  --bg:#FFF3F7;
  --bg-art:radial-gradient(circle at 6% -6%,#FFD0E2 0,rgba(255,208,226,0) 36%),radial-gradient(circle at 100% 4%,#FFE3D6 0,rgba(255,227,214,0) 32%),radial-gradient(circle at 60% 110%,#F2E0FF 0,rgba(242,224,255,0) 42%);
  --bg-size:100% 100%;
  --head:rgba(255,255,255,.86); --head-solid:#FFFFFF;
  --surface:#FFFFFF; --surface2:#FDE8F0; --ink:#3B1E2D; --muted:#8C6576; --line:#F3D0DD;
  --accent:#D3367A; --accent2:#F27AAB; --accent-ink:#FFFFFF; --accent-soft:#FFE1EE;
  --btn-bg:linear-gradient(135deg,#F2649D 0%,#C92F6F 100%); --btn-ink:#FFFFFF;
  --lv1:#24855F; --lv2:#6553CF; --lv3:#B8650F; --lv4:#CF3159;
  --lv1s:#DCF4EA; --lv2s:#ECE8FF; --lv3s:#FFEBD4; --lv4s:#FFE0E8;
  --ok:#24855F; --okS:#DCF4EA; --bad:#CF3159; --badS:#FFE0E8;
  --code-bg:#2B1A2E; --code-ink:#F7E9F0; --code-cm:#B596A9; --code-str:#B7EBCB; --code-kw:#FF9DC6; --code-gut:#8D6C80;
  --shadow:0 2px 4px rgba(211,54,122,.05),0 12px 30px rgba(211,54,122,.09);
  --card-bd:#F3D0DD;
  --hero-bg:linear-gradient(135deg,#FFDCEA 0%,#FFF0E6 55%,#F3E4FF 100%);
  --fc-bg:linear-gradient(160deg,#FFFFFF 0%,#FFEFF6 100%); --fc-back:linear-gradient(160deg,#FFF7FB 0%,#FCE2EE 100%);
  --vid-bg:linear-gradient(135deg,#3E1430 0%,#8A2A5B 55%,#D9508A 100%); --vid-ink:#FFFFFF; --vid-muted:rgba(255,255,255,.74); --vid-hi:#FFE38A; --vid-chip:rgba(255,255,255,.17);
  --deco:"✿ ✦ ♡"; --mark:"✿";
  --f-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-ar:"IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
  --f-display:"Fredoka","IBM Plex Sans",system-ui,sans-serif;
  --f-display-ar:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",sans-serif;
  --h-track:0; --r:18px; --r-btn:999px;
}
:root[data-skin="magic"]{
  color-scheme:dark;
  --bg:#0E0B18;
  --bg-art:radial-gradient(1px 1px at 22px 34px,rgba(255,232,182,.65),rgba(255,232,182,0) 100%),radial-gradient(1px 1px at 150px 92px,rgba(255,232,182,.4),rgba(255,232,182,0) 100%),radial-gradient(1.6px 1.6px at 236px 176px,rgba(255,232,182,.6),rgba(255,232,182,0) 100%),radial-gradient(1px 1px at 318px 44px,rgba(255,232,182,.35),rgba(255,232,182,0) 100%),radial-gradient(1.2px 1.2px at 86px 206px,rgba(255,232,182,.5),rgba(255,232,182,0) 100%),radial-gradient(ellipse at 12% -4%,rgba(124,82,196,.4),rgba(124,82,196,0) 52%),radial-gradient(ellipse at 92% 8%,rgba(226,182,90,.14),rgba(226,182,90,0) 44%);
  --bg-size:360px 240px,360px 240px,360px 240px,360px 240px,360px 240px,100% 100%,100% 100%;
  --head:rgba(16,12,28,.88); --head-solid:#100C1C;
  --surface:#1A1530; --surface2:#262043; --ink:#F2E7CE; --muted:#B6A98F; --line:#3A3157;
  --accent:#E3B75C; --accent2:#F3D58C; --accent-ink:#1B1205; --accent-soft:rgba(227,183,92,.16);
  --btn-bg:linear-gradient(135deg,#F3D58C 0%,#C99334 100%); --btn-ink:#1E1406;
  --lv1:#5BCB98; --lv2:#86B6FF; --lv3:#EFBA55; --lv4:#F5808E;
  --lv1s:rgba(91,203,152,.15); --lv2s:rgba(134,182,255,.15); --lv3s:rgba(239,186,85,.16); --lv4s:rgba(245,128,142,.16);
  --ok:#5BCB98; --okS:rgba(91,203,152,.15); --bad:#F5808E; --badS:rgba(245,128,142,.16);
  --code-bg:#0A0813; --code-ink:#EFE5CE; --code-cm:#918AA8; --code-str:#A8E4BF; --code-kw:#EBC66E; --code-gut:#5F5778;
  --shadow:0 0 0 1px rgba(0,0,0,.25),0 14px 34px rgba(0,0,0,.45);
  --card-bd:rgba(227,183,92,.24);
  --hero-bg:linear-gradient(160deg,#F3E6C8 0%,#E4CFA3 100%);
  --fc-bg:linear-gradient(160deg,#F4E7CA 0%,#E2CB9C 100%); --fc-back:linear-gradient(160deg,#EFDFBC 0%,#D9BF8D 100%);
  --vid-bg:radial-gradient(ellipse at 28% 0%,#43307A 0%,#1A1233 55%,#0B0816 100%); --vid-ink:#F6EBD0; --vid-muted:rgba(246,235,208,.72); --vid-hi:#F3D58C; --vid-chip:rgba(243,213,140,.14);
  --deco:"✦ ☾ ✦"; --mark:"✦";
  --f-display:"Cinzel",Georgia,"Times New Roman",serif;
  --f-display-ar:"Amiri","IBM Plex Sans Arabic",serif;
  --h-track:.02em; --r:12px; --r-btn:10px;
}
/* parchment panels inside the magic look */
:root[data-skin="magic"] .hero,:root[data-skin="magic"] .fc{
  --ink:#3A2915; --muted:#6F5737; --line:rgba(90,60,20,.28); --surface:#F1E3C3; --surface2:#E3CFA5;
  --accent:#8B5A14; --accent-ink:#FFF5DC; --accent-soft:rgba(139,90,20,.14);
  --btn-bg:linear-gradient(135deg,#8B5A14,#5E3A0B); --btn-ink:#FFF3D6;
  --lv1:#2C7A52; --lv2:#2F5BA6; --lv3:#94600F; --lv4:#A3303D;
  --lv1s:rgba(44,122,82,.14); --lv2s:rgba(47,91,166,.14); --lv3s:rgba(148,96,15,.14); --lv4s:rgba(163,48,61,.14);
  border-color:rgba(90,60,20,.35);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background-color:var(--bg);background-image:var(--bg-art);background-size:var(--bg-size);background-attachment:fixed;color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head-solid)}
a{color:var(--accent)}
h1,h2,h3,h4{line-height:1.25;text-wrap:balance;margin:0}
h1,h2{font-family:var(--f-display);letter-spacing:var(--h-track)}
h1{font-size:1.75rem;font-weight:700}
h2{font-size:1.22rem;font-weight:600}
h3{font-size:1.02rem;font-weight:600}
h1 .arl,h2 .arl,h1 [lang="ar"],h2 [lang="ar"],.ttl-ar{font-family:var(--f-display-ar)!important;letter-spacing:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[lang="ar"],.ar{font-family:var(--f-ar);line-height:1.8}
span[lang="ar"]{direction:rtl;unicode-bidi:isolate}
.ar{direction:rtl;text-align:right;unicode-bidi:isolate}
.arl{font-family:var(--f-ar);color:var(--muted);font-weight:500}
.btn .arl,.chip .arl,.chip.on .arl,.tabs a.on .arl,.subtabs button.on .arl,.badge .arl,[class*="tag-s"] .arl{color:inherit;opacity:.85}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--muted)}
.mono{font-family:var(--f-mono)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand b{display:block;font-size:1.02rem;font-family:var(--f-display);letter-spacing:var(--h-track)}
.brand small{display:block;color:var(--muted);font-size:.78rem}
.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--btn-bg);color:var(--btn-ink);font-size:1.15rem;box-shadow:var(--shadow)}
.mark::before{content:var(--mark)}
.top-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:5px 10px;cursor:pointer;font-size:.85rem;color:var(--muted)}
.seg button.on{background:var(--btn-bg);color:var(--btn-ink)}
.skinbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.85rem}
.sync{font-size:.75rem;color:var(--muted);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 10px;font-family:var(--f-mono);font-size:.85rem;text-decoration:none;font-weight:500}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{white-space:nowrap;text-decoration:none;color:var(--muted);padding:9px 12px;border-bottom:2px solid transparent;font-weight:500;font-size:.92rem}
.tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--badS);color:var(--bad);font-size:.72rem;text-align:center}
@media (max-width:600px){.sync,.sk-tx{display:none}.top-row{flex-wrap:nowrap;padding-block:8px}.brand b{font-size:.92rem}.mark{width:32px;height:32px}.seg button{padding:5px 8px}.skinbtn{padding:5px 9px}}

main{padding-block:22px 60px;display:flex;flex-direction:column;gap:20px}

/* generic */
.card{background:var(--surface);border:1px solid var(--card-bd);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--btn-bg);color:var(--btn-ink);padding:9px 16px;border-radius:var(--r-btn);cursor:pointer;font-weight:600;font-size:.9rem;text-decoration:none;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.btn.quiet{background:var(--surface2);color:var(--ink);font-weight:500;box-shadow:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
@media (prefers-reduced-motion:no-preference){.btn{transition:transform .15s}.btn:hover:not(:disabled){transform:translateY(-1px)}}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 11px;border-radius:999px;cursor:pointer;font-size:.85rem}
.chip.on{background:var(--btn-bg);color:var(--btn-ink);border-color:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.lv1{color:var(--lv1);background:var(--lv1s)} .lv2{color:var(--lv2);background:var(--lv2s)}
.lv3{color:var(--lv3);background:var(--lv3s)} .lv4{color:var(--lv4);background:var(--lv4s)}
.ub{background:var(--surface2);color:var(--muted);font-family:var(--f-mono)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.row>.bar{flex:1;min-width:80px}
.bar>span{display:block;height:100%;border-radius:99px;background:var(--btn-bg);transition:width .4s}
.s1>span{background:var(--lv4)} .s2>span{background:var(--lv3)} .s3>span{background:var(--lv2)} .s4>span{background:var(--lv1)}
.tag-s1{color:var(--lv4)} .tag-s2{color:var(--lv3)} .tag-s3{color:var(--lv2)} .tag-s4{color:var(--lv1)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.bi{display:flex;flex-direction:column;gap:6px}

/* home */
.card.hero{background:var(--hero-bg);color:var(--ink);position:relative;overflow:hidden;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
.card.hero::after{content:var(--deco);position:absolute;right:20px;bottom:10px;color:var(--accent);opacity:.45;letter-spacing:8px;font-size:1rem;pointer-events:none}
@media (max-width:640px){.card.hero{grid-template-columns:1fr}}
.quote{font-style:italic;color:var(--muted)}
.ring{position:relative;width:132px;height:132px}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .val b{font-size:1.9rem;font-variant-numeric:tabular-nums;display:block;line-height:1;font-family:var(--f-display)}
.srow{display:grid;grid-template-columns:52px minmax(0,1fr) 140px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.srow:first-of-type{border-top:0}
.srow .un{font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}
.srow .nm{min-width:0}
.srow .nm b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .sv{display:flex;flex-direction:column;gap:4px;font-size:.78rem;font-variant-numeric:tabular-nums}
@media (max-width:520px){.srow{grid-template-columns:44px minmax(0,1fr) 92px}}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:1.4rem;font-variant-numeric:tabular-nums;font-family:var(--f-display)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tips li{margin-bottom:6px}
.rankline{display:flex;gap:12px;align-items:center}
.rankic{font-size:2.2rem;line-height:1}
.minib{display:flex;gap:6px;flex-wrap:wrap;font-size:1.3rem}

/* plan */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}
.day{background:var(--surface);border:1px solid var(--card-bd);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--shadow)}
.day.today{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.day.done{opacity:.75}
.day header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.day ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.day li{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.day label{display:flex;gap:8px;align-items:flex-start;cursor:pointer;min-width:0}
.day input{margin-top:5px;accent-color:var(--accent)}
.day li.ck span{text-decoration:line-through;color:var(--muted)}
.go{font-size:.8rem;white-space:nowrap;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:1px 9px;cursor:pointer;background:none;color:var(--accent)}
.dates{display:flex;gap:14px;flex-wrap:wrap}
.dates label{display:flex;gap:8px;align-items:center}
.dinput{padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}

/* units */
.ucard{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit}
.ucard .n{font-family:var(--f-mono);font-size:.8rem;color:var(--accent);font-weight:500}
.search{width:100%;padding:11px 16px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:inherit}
.res{display:flex;flex-direction:column;gap:0}
.res .kw{padding:10px 0;border-top:1px solid var(--line)}

/* unit page */
.uhead{display:flex;flex-direction:column;gap:8px}
.uhead .n{font-family:var(--f-mono);color:var(--accent);font-weight:500;font-size:.85rem}
.subtabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{white-space:nowrap;border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-weight:500}
.subtabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.subtabs button.vt-tab{color:var(--accent);font-weight:600}
.klo{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.klo:first-child{border-top:0}
.kwlist{display:flex;flex-direction:column}
.kw{display:grid;grid-template-columns:minmax(150px,240px) minmax(0,1fr);gap:6px 18px;padding:12px 0;border-top:1px solid var(--line)}
.kw:first-child{border-top:0}
.kw .t{font-weight:600;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
@media (max-width:600px){.kw{grid-template-columns:1fr}}
.lvhead{display:flex;align-items:center;gap:10px;margin-top:6px}
.lvhead .line{flex:1;height:1px;background:var(--line)}
.topic{background:var(--surface);border:1px solid var(--card-bd);border-left:5px solid var(--lc,var(--accent));border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--shadow)}
.topic.t1{--lc:var(--lv1)} .topic.t2{--lc:var(--lv2)} .topic.t3{--lc:var(--lv3)} .topic.t4{--lc:var(--lv4)}
.topic .tt{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.topic .tt h3 .arl{display:block;font-size:.95rem}
.more{background:var(--surface2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.more .lab{font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ai{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:.93rem}
.ckline{display:flex;align-items:center;gap:8px;font-size:.88rem;cursor:pointer}
.ckline input{accent-color:var(--accent);width:16px;height:16px}
.say.on{background:var(--btn-bg);color:var(--btn-ink)}
.yt{font-size:.85rem;text-decoration:none;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;color:var(--ink);background:var(--surface)}
.yt::before{content:"";width:0;height:0;border-left:8px solid #E52D27;border-top:5px solid transparent;border-bottom:5px solid transparent}
.notes{width:100%;min-height:280px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);font:inherit;line-height:1.7;resize:vertical}

/* lesson clip player */
.vid{display:flex;flex-direction:column;gap:12px}
.vframe{position:relative;overflow:hidden;isolation:isolate;border-radius:var(--r);background:var(--vid-bg);color:var(--vid-ink);min-height:380px;display:flex;flex-direction:column;padding:18px 22px 14px;box-shadow:var(--shadow)}

async function flush() {
  if (!dbRef) return;

  writing = true;

function setSync(m) { syncMode = m; chrome(); }
async function initCloud(tries) {
  const C = window.claude;
  if (!C || typeof C.use !== 'function') {
    if ((tries || 0) < 3) setTimeout(() => initCloud((tries || 0) + 1), 1200);
    return;
  }
  try {
    const [db, user] = await Promise.all([C.use('db'), C.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.doc('data/users/' + id + '/progress');
    const snap = await Promise.race([ref.get(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 10000))]);
    dbRef = ref;
    if (snap.exists) {
      const r = fresh(snap.data());
      if ((r.updatedAt || 0) > (S.updatedAt || 0)) { S = r; saveLocal(); applySkin(); render(false); }
      else if ((S.updatedAt || 0) > (r.updatedAt || 0)) flush();
    } else if (S.updatedAt || firstRun) { flush(); }
    setSync('cloud');
  } catch (e) { setSync('local'); }
}

  try {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = document.createElement('canvas'); c.className = 'confetti'; document.body.appendChild(c);
    const ctx = c.getContext('2d'), W = c.width = innerWidth, H = c.height = innerHeight;
    const cols = S.skin === 'magic' ? ['#F3D58C', '#E3B75C', '#FFF1C9', '#B48CFF', '#86B6FF'] : ['#F2649D', '#FFB3CF', '#D3367A', '#FFD6A5', '#C3A6FF', '#9EE6C8'];
    const ps = Array.from({ length: 130 }, () => ({ x: W / 2 + (Math.random() - .5) * W * .35, y: H * .32, vx: (Math.random() - .5) * 13, vy: -Math.random() * 13 - 4, s: 5 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .35, c: cols[Math.random() * cols.length | 0], st: Math.random() < .3 }));
    let t = 0;
    (function f() {
      ctx.clearRect(0, 0, W, H);
      ps.forEach(p => { p.vy += .33; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; if (p.st) { ctx.beginPath(); ctx.arc(0, 0, p.s / 2, 0, 6.3); ctx.fill(); } else ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); ctx.restore(); });

    })();
  } catch (e) { }
}

/* ---------------- progress maths ---------------- */
function strength(u) {
  const q = u.quiz.reduce((a, _, i) => a + ((S.qs[u.id + '-q' + i] || {}).c ? 1 : 0), 0) / Math.max(1, u.quiz.length);
  const c = u.keywords.reduce((a, _, i) => a + ((S.fc[u.id + '-k' + i] || 0) >= 2 ? 1 : 0), 0) / Math.max(1, u.keywords.length);
  const t = u.topics.reduce((a, _, i) => a + (S.tp[u.id + '-t' + i] ? 1 : 0), 0) / Math.max(1, u.topics.length);
  return Math.round(100 * (0.5 * q + 0.3 * c + 0.2 * t));
}
const sLab = v => v >= 75 ? { en: 'Strong', ar: 'قوي', c: 4 } : v >= 50 ? { en: 'Good', ar: 'جيد', c: 3 } : v >= 25 ? { en: 'Building', ar: 'يتحسن', c: 2 } : { en: 'Weak', ar: 'ضعيف', c: 1 };

function qref(key) { const m = /^(u\d+)-q(\d+)$/.exec(key); if (!m || !UB[m[1]]) return null; const u = UB[m[1]], q = u.quiz[+m[2]]; return q ? { key, u, q } : null; }

function addXP(n) { S.xp = Math.max(0, (S.xp || 0) + n); }
function record(key, ok) {

/* ---------------- hands-on activities ---------------- */
const ATYPE = { sort: ['Sort it', 'صنّف'], order: ['Put in order', 'رتّب'], blank: ['Fill the blank', 'أكمل الفراغ'], pick: ['Scenario', 'سيناريو تطبيقي'] };
function mountAct(el, u, a, key, onPass) {
  if (!el) return;
  const st = { sel: null, place: {}, fills: [], picked: null, tries: 0, checked: false, ok: false, showWhy: false, msg: '' };
  function reset() {
    st.sel = null; st.place = {}; st.fills = []; st.picked = null; st.tries = 0; st.checked = false; st.ok = false; st.showWhy = false; st.msg = '';
    if (a.type === 'order') { let o; do { o = shuffle(a.steps.map((_, i) => i)); } while (a.steps.length > 1 && o.every((v, i) => v === i)); st.ord = o; }
    if (a.type === 'sort') st.pool = shuffle(a.items.map((_, i) => i));
    if (a.type === 'blank') st.bank = shuffle(a.bank);
    if (a.type === 'pick') st.perm = shuffle(a.o.map((_, i) => i));
  }
  function pass() {
    st.ok = true;

      S.actDone[key] = todayKey(); addXP(10);
      if (a.ti != null) { const tk = u.id + '-t' + a.ti; if (!S.tp[tk]) { S.tp[tk] = 1; addXP(6); } }
      persist();
    }
    if (onPass) onPass();
  }
  const itemBtn = i => `<button class="it ${st.sel === i ? 'sel' : ''} ${st.checked ? (st.place[i] === a.items[i][1] ? 'ok' : 'no') : ''}" data-si="${i}">${esc(a.items[i][0])}</button>`;
  function draw() {
    const solved = key && S.actDone[key];
    let h = `<div class="acthead"><span class="atype">✍ ${L(ATYPE[a.type][0], ATYPE[a.type][1])}</span><b>${L(a.t.en, a.t.ar)}</b>${solved ? '<span class="badge lv1">✓ ' + L('Solved', 'محلول') + '</span>' : ''}</div>${bi(a.p, 'small')}`;
    let canCheck = false;
    if (a.type === 'sort') {

      h += `<div class="pool ${st.sel !== null && st.place[st.sel] !== undefined ? 'ready' : ''}" data-sb="-1">${pool.length ? pool.map(itemBtn).join('') : '<span class="small muted">' + L('All placed. Press Check.', 'خلصت. اضغط تحقق.') + '</span>'}</div>`;
      h += `<p class="small muted">${L('Tap an item, then tap the box where it belongs. Tap a placed item to move it again.', 'اضغط على العنصر، ثم اضغط على الصندوق المناسب. وتقدر تضغط على أي عنصر عشان تنقله.')}</p>`;
      h += `<div class="buckets">${a.cats.map((c, ci) => `<div class="bk ${st.sel !== null ? 'ready' : ''}" data-sb="${ci}"><h4>${L(c[0], c[1])}</h4>${st.pool.filter(i => st.place[i] === ci).map(itemBtn).join('')}</div>`).join('')}</div>`;
      canCheck = !pool.length;
    } else if (a.type === 'order') {
      h += `<ol class="olist">${st.ord.map((si, k) => `<li class="${st.checked ? (si === k ? 'ok' : 'no') : ''}"><span class="n">${k + 1}</span><span class="tx">${esc(a.steps[si])}</span><button class="mv" data-mv="${k}:-1" ${k === 0 ? 'disabled' : ''} aria-label="Move up">↑</button><button class="mv" data-mv="${k}:1" ${k === st.ord.length - 1 ? 'disabled' : ''} aria-label="Move down">↓</button></li>`).join('')}</ol>`;

    if (bk && st.sel !== null) { const c = +bk.dataset.sb; if (c < 0) delete st.place[st.sel]; else st.place[st.sel] = c; st.sel = null; st.checked = false; st.msg = ''; draw(); return; }

  reset(); draw();
}

function lessonSteps(u) {
  const steps = [{ k: 'warm' }];
  u.topics.map((t, i) => ({ t, i })).sort((a, b) => a.t.lv - b.t.lv || a.i - b.i).forEach(({ i }) => {
    steps.push({ k: 'learn', ti: i });
    actsFor(u, i).forEach(x => steps.push({ k: 'apply', ti: i, key: x.key, a: x.a }));
  });
  steps.push({ k: 'exit' });
  return steps;
}

      next = steps[si + 1] && steps[si + 1].k === 'apply' ? '✍ ' + L('Now apply it', 'الحين طبّق') : L('Next part', 'الجزء التالي') + ' →';
    } else if (s.k === 'apply') {
      body = '<div id="lsnAct"></div>';
      ready = !!S.actDone[s.key];
      next = ready ? L('Next', 'التالي') + ' →' : L('Skip for now', 'تخطّ الحين');
    } else {
      body = `<div class="card stack"><h2>${L('Exit ticket', 'بطاقة الخروج')}</h2><p class="small muted">${L('Three questions to see what stuck. You solved ' + solved + ' of ' + applied.length + ' activities in this lesson.', 'ثلاثة أسئلة تشوف وش ثبت عندك. حليت ' + solved + ' من ' + applied.length + ' نشاط في هذا الدرس.')}</p><div id="lsnQuiz"></div></div>
        <div class="card stack"><h3>${L('How confident do you feel about this unit?', 'كم ثقتك في هذي الوحدة؟')}</h3>
        <div class="conf">${[[1, '😟', 'Not yet', 'مو بعد'], [2, '🙂', 'Almost', 'تقريباً'], [3, '😎', 'Confident', 'واثق']].map(c => `<button class="chip ${S.conf[u.id] === c[0] ? 'on' : ''}" data-lconf="${c[0]}">${c[1]} ${L(c[2], c[3])}</button>`).join('')}</div>
        <div class="row"><button class="btn" data-ln="finish">🎉 ${L('Finish the lesson', 'أنهِ الدرس')}</button>${S.lessonDone[u.id] ? '<span class="small tag-s4">✓ ' + L('Finished on ' + S.lessonDone[u.id], 'خلصته بتاريخ ' + S.lessonDone[u.id]) + '</span>' : ''}</div></div>`;
    }
    el.innerHTML = `<div class="lsntop"><span class="stage ${g[2]}">${g[3]} ${L(g[0], g[1])}</span><span class="small muted mono">${si + 1} / ${steps.length}</span></div>
      <div class="lsnbar">${steps.map((x, k) => `<i class="${k < si ? 'd' : k === si ? 'c' : ''}"></i>`).join('')}</div>` + body +
      `<div class="lsnnav"><button class="btn quiet" data-ln="back" ${si === 0 ? 'disabled' : ''}>← ${L('Back', 'رجوع')}</button>${s.k !== 'exit' ? `<button class="btn ${ready ? '' : 'quiet'}" data-ln="next">${next}</button>` : `<button class="btn quiet" data-ln="restart">↺ ${L('Restart the lesson', 'أعد الدرس من البداية')}</button>`}</div>`;
    if (s.k === 'warm') { const qi = Math.max(0, u.quiz.findIndex(q => q.lv === 1)), q = u.quiz[qi]; mountAct($('#lsnAct', el), u, { type: 'pick', t: { en: 'Quick guess', ar: 'تخمين سريع' }, p: { en: 'Choose the answer you think is right.', ar: 'اختر الإجابة اللي تحسها صح.' }, q: q.q, o: q.o, a: q.a, why: q.why }, null); }
    if (s.k === 'apply') mountAct($('#lsnAct', el), u, s.a, s.key, navReady);
    if (s.k === 'exit') mountQuiz($('#lsnQuiz', el), shuffle(unitQ(u).filter(r => r.q.lv >= 2)).slice(0, 3), 3);
  }
  el.onclick = e => {
    const b = e.target.closest('[data-ln],[data-lconf]'); if (!b) return;
    if (b.dataset.lconf) { S.conf[u.id] = +b.dataset.lconf; persist(false); el.querySelectorAll('[data-lconf]').forEach(x => x.classList.toggle('on', x === b)); return; }
    const a = b.dataset.ln;
    if (a === 'next') setStep(si + 1);
    else if (a === 'back') setStep(si - 1);
    else if (a === 'restart') setStep(0);
    else if (a === 'finish') { const first = !S.lessonDone[u.id]; S.lessonDone[u.id] = todayKey(); if (first) addXP(60); persist(); confetti(); toast(first ? T2('Lesson finished! +60 XP', 'خلصت الدرس! +60 نقطة') : T2('Lesson finished again. Well done!', 'خلصت الدرس مرة ثانية. أحسنت!')); draw(); }
  };
  draw();
}

/* ---------------- practice ---------------- */
function viewPractice() {
  return `<section class="stack"><h1>${L('Practice', 'التدريب')}</h1>
    <div class="chips"><button class="chip ${P.scope === 'all' ? 'on' : ''}" data-ps="all">${L('All units', 'كل الوحدات')}</button>${U.map(u => `<button class="chip ${P.scope === u.id ? 'on' : ''}" data-ps="${u.id}">U${u.num}</button>`).join('')}</div>
    <div class="subtabs">${[['acts', 'Activities', 'أنشطة تطبيقية'], ['cards', 'Flashcards', 'البطاقات'], ['match', 'Matching game', 'لعبة التوصيل'], ['quiz', 'Quiz', 'الأسئلة'], ['speed', 'Speed round', 'جولة السرعة']].map(m => `<button class="${P.mode === m[0] ? 'on' : ''}" data-pm="${m[0]}">${L(m[1], m[2])}</button>`).join('')}</div>
    ${P.mode === 'quiz' ? `<div class="chips">${[0, 1, 2, 3, 4].map(x => `<button class="chip ${P.level === x ? 'on' : ''}" data-pl="${x}">${x ? L(LV[x].en, LV[x].ar) : L('All levels', 'كل المستويات')}</button>`).join('')}</div>` : ''}
    <div id="pbox"></div></section>`;
}
function mountPractice(el, units, mode, level) {
  if (!el) return;
  if (mode === 'acts') mountActList(el, units);
  else if (mode === 'match') mountMatch(el, units);
  else if (mode === 'speed') mountSpeed(el, units, units.length > 1 ? 'all' : units[0].id);
  else if (mode === 'quiz') { let refs = []; units.forEach(u => refs = refs.concat(unitQ(u))); if (level) refs = refs.filter(r => r.q.lv === level); mountQuiz(el, refs, units.length > 1 ? 15 : 0); }
  else mountCards(el, units);
}

/* ----- flashcards ----- */
function mountCards(el, units) {
  let onlyNew = true, deck, i, flip;
  function build() {
    let d = [];
    units.forEach(u => u.keywords.forEach((k, j) => d.push({ key: u.id + '-k' + j, u, k })));
    if (onlyNew) { const f = d.filter(c => (S.fc[c.key] || 0) < 2); if (f.length) d = f; }
    deck = shuffle(d).sort((a, b) => (S.fc[a.key] || 0) - (S.fc[b.key] || 0)); i = 0; flip = false;
  }
  function draw() {
    const all = []; units.forEach(u => u.keywords.forEach((_, j) => all.push(u.id + '-k' + j)));
    const known = all.filter(k => (S.fc[k] || 0) >= 2).length;
    const head = `<div class="prog"><span>${L('Card', 'بطاقة')} ${Math.min(i + 1, deck.length)} / ${deck.length}</span>${barH(100 * known / Math.max(1, all.length))}<span>${known}/${all.length} ${L('known', 'محفوظة')}</span></div>`;
    if (i >= deck.length) { el.innerHTML = head + `<div class="card stack" style="align-items:center;text-align:center"><span class="big">${known}/${all.length}</span><p>${L('Round finished. Cards you marked "Not yet" come back first next round.', 'خلصت الجولة. البطاقات اللي اخترت فيها "مو بعد" ترجع أول الجولة الجاية.')}</p><div class="row"><button class="btn" data-act="restart">${L('New round', 'جولة جديدة')}</button><button class="btn quiet" data-act="toggle">${onlyNew ? L('Include known cards', 'أضف البطاقات المحفوظة') : L('Only cards I don\'t know', 'فقط اللي ما أعرفها')}</button></div></div>`; return; }
    const c = deck[i];
    el.innerHTML = head + `<div class="fc ${flip ? 'flip' : ''}" data-act="flip" role="button" tabindex="0" aria-label="Flip card">
      <div class="top">${uBadge(c.u)}${lvBadge(c.k.lv)}</div>
      ${flip ? bi({ en: c.k.en, ar: c.k.ar }) : '<div class="term">' + esc(c.k.t) + '</div><p class="muted small">' + L('Say the definition out loud, then flip.', 'قل التعريف بصوت عالي، ثم اقلب البطاقة.') + '</p>'}
      <span class="hint">${flip ? esc(c.k.t) : L('Tap or press Space to flip', 'اضغط أو زر المسافة للقلب')}</span></div>
      <div class="row" style="justify-content:center"><button class="btn again" data-act="again">✗ ${L('Not yet', 'مو بعد')}</button><button class="btn know" data-act="know">✓ ${L('I knew it', 'عرفتها')}</button></div>
      <p class="small muted" style="text-align:center">${L('Keys: Space flip · ← not yet · → knew it', 'الأزرار: المسافة للقلب · ← مو بعد · → عرفتها')}</p>`;
  }
  function act(a) {
    if (a === 'flip') { flip = !flip; draw(); }
    else if (a === 'know' || a === 'again') {
      const c = deck[i]; if (!c) return;
      S.fc[c.key] = a === 'know' ? Math.min(3, Math.max(2, (S.fc[c.key] || 0) + 1)) : 1;
      addXP(a === 'know' ? 4 : 1);
      persist(); i++; flip = false; draw();
    } else if (a === 'restart') { build(); draw(); }
    else if (a === 'toggle') { onlyNew = !onlyNew; build(); draw(); }
  }
  el.onclick = e => { const b = e.target.closest('[data-act]'); if (b) act(b.dataset.act); };
  keyHandler = e => { if (e.key === ' ') { e.preventDefault(); act('flip'); } else if (e.key === 'ArrowRight') act('know'); else if (e.key === 'ArrowLeft') act('again'); };
  build(); draw();
}

/* ----- matching ----- */
function mountMatch(el, units) {
  let pick, left, right, sel, ok, errs, t0, dl = S.lang === 'ar' ? 'ar' : 'en';
  function round() {
    const pool = []; units.forEach(u => u.keywords.forEach((k, j) => pool.push({ key: u.id + '-k' + j, u, k })));
    pick = shuffle(pool).slice(0, Math.min(6, pool.length));
    left = shuffle(pick); right = shuffle(pick); sel = null; ok = new Set(); errs = 0; t0 = Date.now();
  }
  function draw(bad) {
    if (ok.size === pick.length) {
      const s = Math.round((Date.now() - t0) / 1000);
      el.innerHTML = `<div class="card stack" style="align-items:center;text-align:center"><span class="big">${s}s</span><p>${L('All matched with ' + errs + ' wrong tries. +' + (errs ? 15 : 20) + ' XP', 'وصلت الكل مع ' + errs + ' محاولات غلط. +' + (errs ? 15 : 20) + ' نقطة')}</p><button class="btn" data-act="again">${L('Next round', 'الجولة التالية')}</button></div>`;
      return;
    }
    el.innerHTML = `<div class="row" style="justify-content:space-between"><p class="muted small">${L('Pick a term, then the definition that matches it.', 'اختر الكلمة، ثم التعريف المناسب لها.')}</p>
      <div class="row"><span class="small mono">${ok.size}/${pick.length} · ✗ ${errs}</span><button class="btn quiet" data-act="lang">${dl === 'en' ? 'عربي' : 'English'}</button></div></div>
      <div class="mgrid"><div class="mcol">${left.map(c => `<button class="mi t ${ok.has(c.key) ? 'ok' : ''} ${sel === c.key ? 'sel' : ''}" data-l="${c.key}" ${ok.has(c.key) ? 'disabled' : ''}>${esc(c.k.t)}</button>`).join('')}</div>
      <div class="mcol">${right.map(c => `<button class="mi ${dl === 'ar' ? 'ar' : ''} ${ok.has(c.key) ? 'ok' : ''} ${bad === c.key ? 'no' : ''}" data-r="${c.key}" ${ok.has(c.key) ? 'disabled' : ''} ${dl === 'ar' ? 'lang="ar"' : ''}>${esc(dl === 'ar' ? c.k.ar : c.k.en)}</button>`).join('')}</div></div>`;
  }
  el.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.act === 'again') { round(); draw(); return; }
    if (b.dataset.act === 'lang') { dl = dl === 'en' ? 'ar' : 'en'; draw(); return; }
    if (b.dataset.l) { sel = b.dataset.l; draw(); return; }
    if (b.dataset.r) {
      if (!sel) { toast(T2('Pick a term on the left first', 'اختر كلمة من اليسار أولاً')); return; }
      if (b.dataset.r === sel) { ok.add(sel); sel = null; if (ok.size === pick.length) { addXP(errs ? 15 : 20); persist(); if (!errs) confetti(); } draw(); }
      else { errs++; draw(b.dataset.r); }
    }
  };
  round(); draw();
}

/* ----- quiz ----- */
function mountQuiz(el, refs, limit, opts) {
  opts = opts || {};
  let order, i, score, ans, perm, wrong;
  function start(list) { order = shuffle(list); if (limit && order.length > limit) order = order.slice(0, limit); i = 0; score = 0; ans = null; wrong = []; nextPerm(); draw(); }
  function nextPerm() { const q = order[i]; perm = q ? shuffle(q.q.o.map((_, k) => k)) : []; }
  function draw() {
    if (!order.length) { el.innerHTML = `<div class="empty">${opts.empty || L('No questions here yet.', 'ما فيه أسئلة هنا.')}</div>`; return; }
    if (i >= order.length) {
      const pc = Math.round(100 * score / order.length), l = sLab(pc);
      if (pc >= 80) confetti();
      el.innerHTML = `<div class="card stack" style="align-items:center;text-align:center"><span class="big">${score}/${order.length}</span><p><span class="tag-s${l.c}">${pc}% · ${L(l.en, l.ar)}</span></p>
        <p class="muted small">${L('Wrong answers were added to your mistakes notebook.', 'الإجابات الغلط انضافت لدفتر الأخطاء.')}</p>
        <div class="row">${wrong.length ? `<button class="btn" data-act="wrong">${L('Retry the ' + wrong.length + ' I got wrong', 'أعد الـ ' + wrong.length + ' اللي غلطت فيها')}</button>` : ''}<button class="btn quiet" data-act="new">${L('New set', 'مجموعة جديدة')}</button></div></div>`;
      return;
    }
    const r = order[i], q = r.q;
    el.innerHTML = `<div class="prog"><span>${L('Question', 'سؤال')} ${i + 1} / ${order.length}</span>${barH(100 * i / order.length)}<span>✓ ${score}</span></div>
    <div class="card qcard">
      <div class="row">${uBadge(r.u)}${lvBadge(q.lv)}</div>
      <p class="qtext">${esc(q.q)}</p>
      <div class="opts">${perm.map((k, n) => { let c = ''; if (ans !== null) { if (k === q.a) c = 'right'; else if (k === ans) c = 'wrong'; } return `<button class="opt ${c}" data-o="${k}" ${ans !== null ? 'disabled' : ''}><span class="l">${'ABCD'[n] || n + 1}</span><span>${esc(q.o[k])}</span></button>`; }).join('')}</div>
      ${ans !== null ? `<div class="fb ${ans === q.a ? 'good' : 'badf'}"><b>${ans === q.a ? '✓ ' + L('Correct', 'صحيح') : '✗ ' + L('Not quite', 'إجابة غلط')}</b>${ans !== q.a ? '<p>' + L('Correct answer', 'الإجابة الصحيحة') + ': <b>' + esc(q.o[q.a]) + '</b></p>' : ''}${bi(q.why)}</div>
        <div class="row" style="justify-content:flex-end"><button class="btn" data-act="next">${i + 1 < order.length ? L('Next question', 'السؤال التالي') : L('See result', 'شوف النتيجة')} →</button></div>` : '<p class="small muted">' + L('Keys 1–4 to answer', 'الأزرار 1 إلى 4 للإجابة') + '</p>'}
    </div>`;
  }
  function choose(k) {
    if (ans !== null) return;
    const r = order[i]; ans = k; const ok = k === r.q.a;
    if (ok) score++; else wrong.push(r);
    record(r.key, ok); persist(); draw();
  }
  el.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.o !== undefined) choose(+b.dataset.o);
    else if (b.dataset.act === 'next') { i++; ans = null; nextPerm(); draw(); }
    else if (b.dataset.act === 'wrong') start(wrong.slice());
    else if (b.dataset.act === 'new') start(opts.refresh ? opts.refresh() : refs);
  };
  keyHandler = e => { const n = parseInt(e.key, 10); if (ans === null && n >= 1 && n <= perm.length) choose(perm[n - 1]); else if (ans !== null && (e.key === 'Enter' || e.key === 'ArrowRight')) { i++; ans = null; nextPerm(); draw(); } };
  start(refs);
}

/* ----- speed round ----- */
function mountSpeed(el, units, scopeKey) {
  let refs = []; units.forEach(u => refs = refs.concat(unitQ(u)));
  let order = [], i = 0, score = 0, tries = 0, endAt = 0, iv = null, perm = [], last = null, running = false;
  function nextQ() { if (i >= order.length) { order = shuffle(refs); i = 0; } perm = shuffle(order[i].q.o.map((_, k) => k)); }
  function intro() { const best = S.best[scopeKey] || 0; el.innerHTML = `<div class="card stack" style="align-items:center;text-align:center"><span class="big">60s</span><p>${L('Answer as many questions as you can in 60 seconds. Wrong answers still go to your mistakes notebook.', 'جاوب أكبر عدد من الأسئلة خلال 60 ثانية. الإجابات الغلط تنضاف لدفتر الأخطاء.')}</p><p class="small muted">${L('Best score', 'أفضل نتيجة')}: ${best}</p><button class="btn" data-act="go">${L('Start', 'ابدأ')}</button></div>`; }
  function draw() { const r = order[i], q = r.q; el.innerHTML = `<div class="card qcard"><div class="row" style="justify-content:space-between"><span class="spclock" id="spClock">${Math.max(0, Math.ceil((endAt - Date.now()) / 1000))}s</span><span class="mono">✓ ${score} / ${tries}</span></div>${last === null ? '' : `<p class="small ${last ? 'tag-s4' : 'tag-s1'}">${last ? '✓ ' + L('Correct', 'صحيح') : '✗ ' + L('Wrong', 'غلط')}</p>`}<div class="row">${uBadge(r.u)}${lvBadge(q.lv)}</div><p class="qtext">${esc(q.q)}</p><div class="opts">${perm.map((k, n) => `<button class="opt" data-o="${k}"><span class="l">${'ABCD'[n]}</span><span>${esc(q.o[k])}</span></button>`).join('')}</div></div>`; }
  function start() { order = shuffle(refs); i = 0; score = 0; tries = 0; last = null; endAt = Date.now() + 60000; running = true; nextQ(); draw(); clearInterval(iv); iv = setInterval(() => { if (!el.isConnected) { clearInterval(iv); return; } const left = endAt - Date.now(); const c = el.querySelector('#spClock'); if (c) c.textContent = Math.max(0, Math.ceil(left / 1000)) + 's'; if (left <= 0) finish(); }, 200); }
  function finish() { clearInterval(iv); running = false; const best = S.best[scopeKey] || 0, nb = score > best; if (nb) S.best[scopeKey] = score; addXP(score * 3); persist(); if (nb && score >= 5) confetti(); el.innerHTML = `<div class="card stack" style="align-items:center;text-align:center"><span class="big">${score}</span><p>${L(score + ' correct out of ' + tries + ' in 60 seconds.', score + ' صح من ' + tries + ' خلال 60 ثانية.')}</p>${nb ? '<p class="tag-s4">' + L('New best score!', 'رقم قياسي جديد!') + '</p>' : '<p class="small muted">' + L('Best', 'الأفضل') + ': ' + best + '</p>'}<button class="btn" data-act="go">${L('Play again', 'العب مرة ثانية')}</button></div>`; }
  function answer(k) { const r = order[i], ok = k === r.q.a; tries++; if (ok) score++; record(r.key, ok); persist(); last = ok; i++; nextQ(); draw(); }
  el.onclick = e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.act === 'go') { start(); return; } if (running && b.dataset.o !== undefined) answer(+b.dataset.o); };
  keyHandler = e => { const n = parseInt(e.key, 10); if (running && n >= 1 && n <= perm.length) answer(perm[n - 1]); };
  intro();
}

/* ----- mistakes ----- */
function viewMistakes() {
  const refs = Object.keys(S.mis).map(qref).filter(Boolean);
  const by = {}; refs.forEach(r => (by[r.u.id] = by[r.u.id] || []).push(r));
  return `<section class="row" style="justify-content:space-between"><div class="stack" style="gap:4px"><h1>${L('Mistakes notebook', 'دفتر الأخطاء')}</h1><p class="muted">${L('Every question you get wrong lands here. Answer it correctly once and it leaves the notebook.', 'كل سؤال تغلط فيه ينضاف هنا. جاوبه صح مرة وحدة ويطلع من الدفتر.')}</p></div>
    ${refs.length ? `<button class="btn" data-mis="retry">${L('Retry all ' + refs.length, 'أعد الكل (' + refs.length + ')')}</button>` : ''}</section>
  <div id="mbox"></div>
  ${refs.length ? U.filter(u => by[u.id]).map(u => `<section class="card"><h2 style="margin-bottom:4px">${uBadge(u)} ${esc(u.title.en)}</h2>${by[u.id].map(r => `<div class="rv"><div class="row" style="justify-content:space-between"><p><b>${esc(r.q.q)}</b></p><button class="go" data-unmis="${r.key}">${L('Remove', 'احذف')}</button></div><p class="small"><span style="color:var(--ok)">✓ ${esc(r.q.o[r.q.a])}</span></p>${bi(r.q.why, 'small muted')}</div>`).join('')}</section>`).join('') : `<div class="empty">${L('Nothing here yet. Do a quiz or a mock exam; wrong answers are saved automatically.', 'ما فيه شيء الحين. سوّ اختبار أو اختبار تجريبي؛ الإجابات الغلط تنحفظ تلقائياً.')}</div>`}`;
}

/* ----- revision sheet ----- */
function viewRevision() {
  return `<section class="stack" style="gap:4px"><h1>${L('Quick revision sheet', 'ورقة المراجعة السريعة')}</h1><p class="muted">${L('Every keyword from every unit on one page. Perfect for the night before the exam.', 'كل الكلمات المفتاحية من كل الوحدات في صفحة وحدة. مثالية لليلة قبل الاختبار.')}</p></section>
  ${U.map((u, n) => `<details class="card rev" ${n === 0 ? 'open' : ''}><summary>${uBadge(u)} ${esc(u.title.en)}${S.lang !== 'en' ? ' <span class="arl" lang="ar">' + esc(u.title.ar) + '</span>' : ''}<span class="small muted">${u.keywords.length}</span></summary>
    ${u.keywords.slice().sort((a, b) => a.lv - b.lv).map(k => `<div class="rk"><b>${esc(k.t)}</b><span>${S.lang === 'ar' ? '<span lang="ar" class="ar" style="display:block">' + esc(k.ar) + '</span>' : esc(k.en) + (S.lang === 'both' ? '<span class="ar arl" lang="ar" style="display:block">' + esc(k.ar) + '</span>' : '')}</span></div>`).join('')}

  if (d.watch) { const r = topicRef(d.watch); if (!r) return; VID.startTopic = r.i; UT.tab = 'video'; render(); return; }
  if (d.gat !== undefined) { const gid = route().slice(3); if (!GAD[gid]) return; S.gaStep[gid] = Math.max(0, +d.gat); persist(false); render(false); const el = $('#gatask'); if (el) window.scrollTo({ top: Math.max(0, el.getBoundingClientRect().top + window.scrollY - 90), behavior: 'smooth' }); return; }
  if (d.gast !== undefined) { const gid = route().slice(3), g = GAU.find(x => x.id === gid); if (!g) return; const k = gaKey(g, Math.min(S.gaStep[gid] || 0, g.tasks.length - 1)), v = +d.gast; if (v === 3 && S.gaSt[k] !== 3) { addXP(30); confetti(); } S.gaSt[k] = v; persist(); render(false); return; }
  if (d.gacopy) { const txt = ($('#gamsg') || {}).textContent || ''; const p = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(txt) : Promise.reject(); p.then(() => toast(T2('Message copied. Paste it in the chat with your screenshots.', 'تم نسخ الرسالة. الصقها في المحادثة مع لقطاتك.')), () => { const rg = document.createRange(); rg.selectNodeContents($('#gamsg')); const sl = getSelection(); sl.removeAllRanges(); sl.addRange(rg); toast(T2('Message selected. Press Ctrl+C to copy.', 'تم تحديد الرسالة. اضغط Ctrl+C للنسخ.')); }); return; }
  if (d.askGa) { askGA(b); return; }
  if (d.apply) { const r = topicRef(d.apply), box = document.getElementById('apply-' + d.apply); if (!r || !box) return; box.hidden = !box.hidden; if (!box.hidden && !box.childElementCount) { const list = actsFor(r.u, r.i); box.innerHTML = list.map((_, k) => '<div id="ap-' + d.apply + '-' + k + '"></div>').join(''); list.forEach((x, k) => mountAct(document.getElementById('ap-' + d.apply + '-' + k), r.u, x.a, x.key)); } return; }
  if (d.more) { const m = document.getElementById('more-' + d.more); m.hidden = !m.hidden; b.innerHTML = m.hidden ? L('Explain more', 'اشرح أكثر') : L('Hide', 'إخفاء'); return; }
  if (d.say) { say(b); return; }
  if (d.ask) { ask(b); return; }
  if (d.v === 'play') { vPlay(); return; }
  if (d.v === 'toggle') { VID.playing ? vPause() : vPlay(); return; }
  if (d.vstep) { vGo(VID.si + (+d.vstep)); return; }
  if (d.vgo !== undefined) { vGo(+d.vgo); return; }
  if (d.vlang) { if (VID.lang === d.vlang) return; const was = VID.playing, si = VID.si; VID.tok++; VID.playing = false; vStopAudio(); VID.lang = d.vlang; VID.builtLang = d.vlang; VID.slides = buildSlides(UB[VID.u], d.vlang); VID.si = Math.min(si, VID.slides.length - 1); VID.li = 0; vDraw(); if (was) vRun(); return; }
  if (d.vrate) { VID.rate = +d.vrate; vDraw(); return; }
  if (d.vmute) { VID.mute = !VID.mute; if (VID.mute) vStopAudio(); vDraw(); if (VID.playing) { VID.tok++; vRun(); } return; }
  if (d.vfs) { const f = $('#vframe'); try { if (document.fullscreenElement) document.exitFullscreen(); else if (f && f.requestFullscreen) f.requestFullscreen().catch(() => toast(T2('Full screen is not available here.', 'ملء الشاشة غير متاح هنا.'))); } catch (err) { } return; }
  if (d.qod !== undefined) { const k = todayKey(); if (S.qod[k]) return; const r = qodRef(), a = +d.qod, ok = a === r.q.a; record(r.key, ok); if (ok) addXP(15); S.qod[k] = { a, ok }; persist(); if (ok) confetti(); render(false); return; }
  if (d.copy) { const [uid, i] = d.copy.split(':'); const txt = UB[uid].code[+i].src; const p = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(txt) : Promise.reject(); p.then(() => toast(T2('Code copied', 'تم نسخ الكود')), () => { const pre = b.closest('.codebox').querySelector('.src pre'); const rg = document.createRange(); rg.selectNodeContents(pre); const sl = getSelection(); sl.removeAllRanges(); sl.addRange(rg); toast(T2('Code selected. Press Ctrl+C to copy.', 'تم تحديد الكود. اضغط Ctrl+C للنسخ.')); }); return; }
  if (d.mis === 'retry') { const refs = Object.keys(S.mis).map(qref).filter(Boolean); const box = $('#mbox'); mountQuiz(box, refs, 0, { refresh: () => Object.keys(S.mis).map(qref).filter(Boolean), empty: L('Your mistakes notebook is empty. Well done!', 'دفتر الأخطاء فاضي. أحسنت!') }); box.scrollIntoView({ behavior: 'smooth' }); return; }
  if (d.unmis) { delete S.mis[d.unmis]; persist(false); render(false); return; }
  if (d.exn) { exCount = +d.exn; render(false); return; }
  if (d.ex) {
    if (d.ex === 'start') { EX = buildExam(exCount); render(); return; }
    if (d.ex === 'reset') { EX = null; render(); return; }
    if (!EX || EX.done) return;
    if (d.ex === 'flag') EX.flag[EX.i] = !EX.flag[EX.i];
    if (d.ex === 'prev') EX.i = Math.max(0, EX.i - 1);
    if (d.ex === 'next') EX.i = Math.min(EX.qs.length - 1, EX.i + 1);
    if (d.ex === 'submit') { if (!EX.confirm) { EX.confirm = true; } else { submitExam(); render(); return; } }
    else EX.confirm = false;

  }
  if (d.exo !== undefined && EX && !EX.done) { EX.ans[EX.i] = +d.exo; EX.confirm = false; render(false); return; }
  if (d.exg !== undefined && EX && !EX.done) { EX.i = +d.exg; EX.confirm = false; render(false); return; }
  if (d.tm) { tSet(d.tm); return; }
  if (d.tlen) { TM.len.focus = +d.tlen; if (TM.mode === 'focus' && !TM.running) tSet('focus'); else updTimer(); return; }
  if (d.snd) { playNoise(d.snd); updTimer(); return; }
  if (d.t === 'go') { TM.running ? tPause() : tStart(); return; }
  if (d.t === 'reset') { tSet(TM.mode); return; }
});
document.addEventListener('change', e => {

  if (t.dataset.plan) { if (t.checked) { S.plan[t.dataset.plan] = 1; addXP(5); } else { delete S.plan[t.dataset.plan]; addXP(-5); } persist(); render(false); return; }
  if (t.dataset.gachk) { if (t.checked) S.gaChk[t.dataset.gachk] = 1; else delete S.gaChk[t.dataset.gachk]; persist(); const li = t.closest('li'); if (li) li.classList.toggle('ck', t.checked); return; }
  if (t.dataset.tp) { if (t.checked) { S.tp[t.dataset.tp] = 1; addXP(6); } else { delete S.tp[t.dataset.tp]; addXP(-6); } persist(); return; }
  if (t.id === 'startDate' && t.value) { S.start = t.value; persist(false); render(false); return; }
  if (t.id === 'examDate' && t.value) { S.examDate = t.value; persist(false); render(false); }
});
document.addEventListener('input', e => {

  if (t.dataset && t.dataset.notes) { S.notes[t.dataset.notes] = t.value; clearTimeout(noteT); noteT = setTimeout(() => { persist(); const s = $('#noteSaved'); if (s) s.textContent = T2('Saved', 'تم الحفظ'); }, 700); }
});
document.addEventListener('keydown', e => {
  if (!keyHandler) return;
  const tg = e.target; if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.isContentEditable)) return;
  if (tg && tg.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
  keyHandler(e);
});
window.addEventListener('hashchange', () => render());
setInterval(() => { tTick(); exTick(); }, 500);
try { window.speechSynthesis && window.speechSynthesis.getVoices(); } catch (e) { }

if (!U.length) { $('#view').innerHTML = '<div class="empty">The unit data did not load.</div>'; return; }
if (firstRun) { S.updatedAt = 0; saveLocal(); }
render();
initCloud(0);
})();
